<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script>

  <style>
    :root {

    body {
      background-color: #070a12;

      border: 1px solid rgba(56, 189, 248, 0.35);

      padding: 30px;
      max-width: 420px;

      margin-top: 0;
      color: #38bdf8;
    }
    p {

      font-size: 0.95rem;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 6px;
