<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wizard's Chess — Two-Player Local Edition</title>
  <!-- Google Fonts for Magical Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <!-- Chess.js Engine for Full Legal Move Validation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b090e;
      --bg-panel: #16121d;
      --gold: #d4af37;
      --gold-bright: #f9df7b;
      --crimson: #8b1e24;
      --crimson-glow: #e63946;
      --emerald: #1b4d3e;
      --emerald-glow: #2ec4b6;
      --stone-light: #4a4453;
      --stone-dark: #231f29;
      --parchment: #e8dcb8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1f172b 0%, #09070c 100%);
      color: var(--parchment);
      font-family: 'Crimson Pro', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 14px;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      color: var(--gold-bright);
      text-shadow: 0 0 18px rgba(212, 175, 55, 0.55), 0 3px 6px #000;
      letter-spacing: 2px;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      color: #a99bbd;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .game-layout {
      display: grid;
      grid-template-columns: 280px auto 280px;
      gap: 24px;
      align-items: start;
      max-width: 1280px;
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 1080px) {
      .game-layout {
        grid-template-columns: 1fr;
        justify-items: center;
      }
      .side-panel {
        width: min(92vw, 560px) !important;
      }
    }

    /* Magical Side Panels */
    .side-panel {
      background: linear-gradient(180deg, rgba(28, 23, 38, 0.95) 0%, rgba(16, 13, 22, 0.98) 100%);
      border: 2px solid var(--gold);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75), inset 0 0 20px rgba(212, 175, 55, 0.12);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .house-card {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      background: rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    .house-card.active-white {
      border-color: var(--gold-bright);
      box-shadow: 0 0 16px rgba(230, 57, 70, 0.45);
      background: linear-gradient(135deg, rgba(139, 30, 36, 0.4), rgba(0, 0, 0, 0.5));
    }

    .house-card.active-black {
      border-color: var(--emerald-glow);
      box-shadow: 0 0 16px rgba(46, 196, 182, 0.4);
      background: linear-gradient(135deg, rgba(27, 77, 62, 0.5), rgba(0, 0, 0, 0.5));
    }

    .house-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .gryffindor-title { color: var(--gold-bright); }
    .slytherin-title { color: #80ed99; }

    .turn-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--gold);
      color: #111;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .active-white .turn-badge,
    .active-black .turn-badge {
      opacity: 1;
    }

    .graveyard {
      min-height: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      font-size: 1.35rem;
      padding: 4px 6px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 6px;
    }

    /* Board Wrapper */
    .board-container {
      position: relative;
      padding: 18px;
      background: linear-gradient(145deg, #2b2218, #140f0a);
      border: 4px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(212, 175, 55, 0.25);
    }

    .board-wrapper {
      position: relative;
      width: min(84vw, 560px);
      height: min(84vw, 560px);
    }

    #chessboard {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 2px solid var(--gold);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #chessboard.flipped {
      transform: rotate(180deg);
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .square.light {
      background: radial-gradient(circle, #60586c 0%, #4a4354 100%);
      box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.08);
    }

    .square.dark {
      background: radial-gradient(circle, #282330 0%, #191520 100%);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.65);
    }

    .square.selected {
      background: radial-gradient(circle, rgba(249, 223, 123, 0.55) 0%, rgba(212, 175, 55, 0.35) 100%) !important;
      box-shadow: inset 0 0 15px var(--gold-bright);
    }

    .square.last-move {
      box-shadow: inset 0 0 0 3px rgba(212, 175, 55, 0.55);
    }

    .square.in-check {
      background: radial-gradient(circle, rgba(230, 57, 70, 0.85) 0%, rgba(139, 30, 36, 0.6) 100%) !important;
      animation: pulseCheck 1s infinite alternate;
    }

    @keyframes pulseCheck {
      from { box-shadow: inset 0 0 10px #ff4d4d; }
      to { box-shadow: inset 0 0 28px #ff0000; }
    }

    /* Legal Move Runes */
    .square.legal-move::after {
      content: '';
      width: 26%;
      height: 26%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-bright), var(--gold));
      box-shadow: 0 0 12px var(--gold-bright);
      opacity: 0.85;
      pointer-events: none;
    }

    .square.legal-capture::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 3px dashed #ff595e;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255, 89, 94, 0.7);
      animation: spinRune 6s linear infinite;
      pointer-events: none;
    }

    @keyframes spinRune {
      to { transform: rotate(360deg); }
    }

    /* Pieces */
    .piece {
      font-size: clamp(2.1rem, 5.5vw, 3.2rem);
      line-height: 1;
      transition: transform 0.25s ease, filter 0.25s ease;
      z-index: 2;
      pointer-events: none;
    }

    #chessboard.flipped .piece {
      transform: rotate(180deg);
    }

    .piece.white {
      color: #fff6d6;
      text-shadow:
        0 2px 0 #b8860b,
        0 4px 8px rgba(0, 0, 0, 0.85),
        0 0 14px rgba(230, 57, 70, 0.75);
    }

    .piece.black {
      color: #b7efc5;
      text-shadow:
        0 2px 0 #1b4332,
        0 4px 8px rgba(0, 0, 0, 0.95),
        0 0 14px rgba(46, 196, 182, 0.8);
    }

    .square:hover .piece {
      filter: brightness(1.2);
    }

    /* Coordinates */
    .coord-rank, .coord-file {
      position: absolute;
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      color: rgba(212, 175, 55, 0.65);
      pointer-events: none;
    }
    .coord-rank { top: 3px; left: 5px; }
    .coord-file { bottom: 2px; right: 5px; }
    #chessboard.flipped .coord-rank,
    #chessboard.flipped .coord-file {
      transform: rotate(180deg);
    }

    /* FX Canvas & Spell Banner */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .spell-callout {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.2rem;
      color: var(--gold-bright);
      text-shadow: 0 0 20px #ff4d4d, 0 4px 10px #000;
      pointer-events: none;
      opacity: 0;
      z-index: 15;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
    }

    .spell-callout.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }

    .shake {
      animation: boardShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes boardShake {
      10%, 90% { transform: translate3d(-3px, 1px, 0); }
      20%, 80% { transform: translate3d(5px, -2px, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 3px, 0); }
      40%, 60% { transform: translate3d(6px, -3px, 0); }
    }

    /* Controls & Status */
    .status-banner {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.4);
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--gold-bright);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 1px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--gold);
      background: linear-gradient(180deg, #2d2338 0%, #191321 100%);
      color: var(--gold-bright);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: linear-gradient(180deg, #3f314f 0%, #251c30 100%);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.45);
      transform: translateY(-1px);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      padding: 6px 4px;
    }

    /* Move Scroll */
    .scroll-box {
      height: 220px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 6px;
      padding: 10px;
      font-size: 0.95rem;
    }

    .move-row {
      display: grid;
      grid-template-columns: 36px 1fr 1fr;
      padding: 3px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .move-num { color: var(--gold); font-family: 'Cinzel', serif; font-size: 0.8rem; }

    /* Promotion Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--bg-panel);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
    }

    .promo-options {
      display: flex;
      gap: 14px;
      margin-top: 16px;
    }

    .promo-btn {
      font-size: 2.6rem;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.06);
    }
  </style>
</head>
<body>

  <header>
    <h1>Wizard's Chess</h1>
    <div class="subtitle">The Great Hall Tabletop Edition</div>
  </header>

  <main class="game-layout">
    <!-- Left Panel: Houses & Fallen Pieces -->
    <aside class="side-panel">
      <div id="card-white" class="house-card active-white">
        <div class="house-header">
          <span class="gryffindor-title">🦁 Gryffindor (White)</span>
          <span class="turn-badge">Your Wand</span>
        </div>
        <div style="font-size: 0.85rem; color: #ccc; margin-bottom: 6px;">Shattered Enemy Pieces:</div>
        <div id="captured-by-white" class="graveyard"></div>
      </div>

      <div id="card-black" class="house-card">
        <div class="house-header">
          <span class="slytherin-title">🐍 Slytherin (Black)</span>
          <span class="turn-badge">Your Wand</span>
        </div>
        <div style="font-size: 0.85rem; color: #ccc; margin-bottom: 6px;">Shattered Enemy Pieces:</div>
        <div id="captured-by-black" class="graveyard"></div>
      </div>

      <div class="status-banner" id="status-text">
        Gryffindor's Turn — Command a piece!
      </div>
    </aside>

    <!-- Center: The Enchanted Board -->
    <section class="board-container" id="board-frame">
      <div class="board-wrapper">
        <div id="chessboard"></div>
        <canvas id="fx-canvas"></canvas>
        <div id="spell-callout" class="spell-callout">REDUCTO!</div>
      </div>
    </section>

    <!-- Right Panel: Scroll of Moves & Controls -->
    <aside class="side-panel">
      <div style="font-family: 'Cinzel', serif; color: var(--gold-bright); font-weight: 700;">
        📜 Scroll of Incantations
      </div>
      <div id="move-history" class="scroll-box"></div>

      <div class="toggle-row">
        <label for="auto-flip">Auto-Flip Board Each Turn</label>
        <input type="checkbox" id="auto-flip" />
      </div>

      <div class="btn-group">
        <button id="btn-flip">🔄 Flip Board View</button>
        <button id="btn-undo">⏳ Time-Turner (Undo Move)</button>
        <button id="btn-reset">✨ Finite Incantatem (New Game)</button>
      </div>
    </aside>
  </main>

  <!-- Pawn Transfiguration (Promotion) Modal -->
  <div class="modal-overlay" id="promo-modal">
    <div class="modal-card">
      <h2 style="font-family: 'Cinzel', serif; color: var(--gold-bright);">Transfigure Your Pawn</h2>
      <p style="margin-top: 4px; color: #ccc;">Choose the piece your pawn ascends into:</p>
      <div class="promo-options" id="promo-choices"></div>
    </div>
  </div>

  <script>
    const game = new Chess();
    const boardEl = document.getElementById('chessboard');
    const boardFrame = document.getElementById('board-frame');
    const statusEl = document.getElementById('status-text');
    const moveHistoryEl = document.getElementById('move-history');
    const capturedByWhiteEl = document.getElementById('captured-by-white');
    const capturedByBlackEl = document.getElementById('captured-by-black');
    const cardWhite = document.getElementById('card-white');
    const cardBlack = document.getElementById('card-black');
    const spellCallout = document.getElementById('spell-callout');
    const promoModal = document.getElementById('promo-modal');
    const promoChoices = document.getElementById('promo-choices');
    const autoFlipCheckbox = document.getElementById('auto-flip');

    const PIECE_GLYPHS = {
      w: { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
      b: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
    };

    const COMBAT_SPELLS = [
      'REDUCTO!',
      'BOMBARDA!',
      'CONFRINGO!',
      'DIFFINDO!',
      'EXPULSO!',
      'STUPEFY!'
    ];

    let selectedSquare = null;
    let legalMovesForSelected = [];
    let lastMoveSquares = [];
    let isFlipped = false;
    let pendingPromotion = null;

    // Sound Synthesizer (Web Audio API — works offline with zero external assets)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;

      if (type === 'move') {
        // Deep stone slide thud
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(115, now);
        osc.frequency.exponentialRampToValueAtTime(48, now + 0.14);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'capture') {
        // Explosive stone shatter
        const bufferSize = audioCtx.sampleRate * 0.35;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.1));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(900, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.65, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

        noise.connect(filter).connect(gain).connect(audioCtx.destination);
        noise.start(now);
      } else if (type === 'check') {
        // Magical chime warning
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.setValueAtTime(880, now + 0.12); // A5
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.008, now + 0.45);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      }
    }

    // Shatter Particle System
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = boardEl.clientWidth;
      canvas.height = boardEl.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function triggerCaptureFX(squareName, capturedColor) {
      resizeCanvas();
      const file = squareName.charCodeAt(0) - 97;
      const rank = 8 - parseInt(squareName[1], 10);

      const visualCol = isFlipped ? 7 - file : file;
      const visualRow = isFlipped ? 7 - rank : rank;

      const sqSize = canvas.width / 8;
      const cx = visualCol * sqSize + sqSize / 2;
      const cy = visualRow * sqSize + sqSize / 2;

      const palette = capturedColor === 'w'
        ? ['#f9df7b', '#d4af37', '#e63946', '#ffffff']
        : ['#2ec4b6', '#80ed99', '#9d4edd', '#c7f9cc'];

      for (let i = 0; i < 42; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6.5;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          size: 3 + Math.random() * 5,
          color: palette[Math.floor(Math.random() * palette.length)],
          alpha: 1,
          decay: 0.018 + Math.random() * 0.02
        });
      }

      // Trigger spell text & board shake
      const spell = COMBAT_SPELLS[Math.floor(Math.random() * COMBAT_SPELLS.length)];
      spellCallout.textContent = spell;
      spellCallout.classList.add('show');
      boardFrame.classList.remove('shake');
      void boardFrame.offsetWidth;
      boardFrame.classList.add('shake');

      setTimeout(() => spellCallout.classList.remove('show'), 850);
      requestAnimationFrame(animateParticles);
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.18; // gravity on stone shards
        p.alpha -= p.decay;

        if (p.alpha > 0) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.fillRect(p.x, p.y, p.size, p.size);
          ctx.restore();
        }
      });
      particles = particles.filter(p => p.alpha > 0);
      if (particles.length > 0) {
        requestAnimationFrame(animateParticles);
      }
    }

    // Find King Square for Check Highlight
    function findKingSquare(color) {
      const board = game.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = board[r][c];
          if (piece && piece.type === 'k' && piece.color === color) {
            return String.fromCharCode(97 + c) + (8 - r);
          }
        }
      }
      return null;
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      const boardState = game.board();
      const inCheckKingSq = game.in_check() ? findKingSquare(game.turn()) : null;

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sqName = String.fromCharCode(97 + c) + (8 - r);
          const sqDiv = document.createElement('div');
          const isLight = (r + c) % 2 === 0;
          sqDiv.className = `square ${isLight ? 'light' : 'dark'}`;
          sqDiv.dataset.square = sqName;

          if (selectedSquare === sqName) sqDiv.classList.add('selected');
          if (lastMoveSquares.includes(sqName)) sqDiv.classList.add('last-move');
          if (inCheckKingSq === sqName) sqDiv.classList.add('in-check');

          const matchingMove = legalMovesForSelected.find(m => m.to === sqName);
          if (matchingMove) {
            if (matchingMove.captured || matchingMove.flags.includes('e')) {
              sqDiv.classList.add('legal-capture');
            } else {
              sqDiv.classList.add('legal-move');
            }
          }

          // Coordinate Labels on Edges
          if (c === 0) {
            const rankSpan = document.createElement('span');
            rankSpan.className = 'coord-rank';
            rankSpan.textContent = 8 - r;
            sqDiv.appendChild(rankSpan);
          }
          if (r === 7) {
            const fileSpan = document.createElement('span');
            fileSpan.className = 'coord-file';
            fileSpan.textContent = String.fromCharCode(97 + c);
            sqDiv.appendChild(fileSpan);
          }

          const piece = boardState[r][c];
          if (piece) {
            const pSpan = document.createElement('span');
            pSpan.className = `piece ${piece.color === 'w' ? 'white' : 'black'}`;
            pSpan.textContent = PIECE_GLYPHS[piece.color][piece.type];
            sqDiv.appendChild(pSpan);
          }

          sqDiv.addEventListener('click', () => handleSquareClick(sqName));
          boardEl.appendChild(sqDiv);
        }
      }

      updateHUD();
    }

    function handleSquareClick(sqName) {
      if (game.game_over()) return;

      // Check if clicking a legal destination for the currently selected piece
      const moveCandidate = legalMovesForSelected.filter(m => m.to === sqName);
      if (selectedSquare && moveCandidate.length > 0) {
        // Check if promotion move
        const isPromotion = moveCandidate.some(m => m.flags.includes('p'));
        if (isPromotion) {
          openPromotionModal(selectedSquare, sqName, game.turn());
          return;
        }
        executeMove(selectedSquare, sqName);
        return;
      }

      // Otherwise select friendly piece
      const pieceOnSq = game.get(sqName);
      if (pieceOnSq && pieceOnSq.color === game.turn()) {
        selectedSquare = sqName;
        legalMovesForSelected = game.moves({ square: sqName, verbose: true });
      } else {
        selectedSquare = null;
        legalMovesForSelected = [];
      }
      renderBoard();
    }

    function openPromotionModal(from, to, color) {
      pendingPromotion = { from, to };
      promoChoices.innerHTML = '';
      ['q', 'r', 'b', 'n'].forEach(type => {
        const btn = document.createElement('button');
        btn.className = 'promo-btn';
        btn.textContent = PIECE_GLYPHS[color][type];
        btn.onclick = () => {
          promoModal.classList.remove('active');
          executeMove(pendingPromotion.from, pendingPromotion.to, type);
          pendingPromotion = null;
        };
        promoChoices.appendChild(btn);
      });
      promoModal.classList.add('active');
    }

    function executeMove(from, to, promotion = 'q') {
      const moveObj = game.move({ from, to, promotion });
      if (!moveObj) return;

      selectedSquare = null;
      legalMovesForSelected = [];
      lastMoveSquares = [moveObj.from, moveObj.to];

      if (moveObj.captured) {
        const enemyColor = moveObj.color === 'w' ? 'b' : 'w';
        triggerCaptureFX(moveObj.to, enemyColor);
        playSound('capture');
      } else if (game.in_check()) {
        playSound('check');
      } else {
        playSound('move');
      }

      if (autoFlipCheckbox.checked && !game.game_over()) {
        setTimeout(() => {
          isFlipped = game.turn() === 'b';
          boardEl.classList.toggle('flipped', isFlipped);
        }, 320);
      }

      renderBoard();
    }

    function updateHUD() {
      const turn = game.turn();
      cardWhite.classList.toggle('active-white', turn === 'w');
      cardBlack.classList.toggle('active-black', turn === 'b');

      if (game.in_checkmate()) {
        const winner = turn === 'w' ? 'Slytherin (Black)' : 'Gryffindor (White)';
        statusEl.textContent = `⚡ CHECKMATE! ${winner} wins the House Cup!`;
      } else if (game.in_draw()) {
        statusEl.textContent = `⚖️ Match Drawn by Magical Decree!`;
      } else {
        const house = turn === 'w' ? 'Gryffindor (White)' : 'Slytherin (Black)';
        const checkWarn = game.in_check() ? ' — ⚡ KING IN CHECK!' : '';
        statusEl.textContent = `${house} to Move${checkWarn}`;
      }

      // Compute Captured Pieces & Move Log from History
      const history = game.history({ verbose: true });
      const whiteCaptures = [];
      const blackCaptures = [];

      history.forEach(m => {
        if (m.captured) {
          if (m.color === 'w') {
            whiteCaptures.push(PIECE_GLYPHS['b'][m.captured]);
          } else {
            blackCaptures.push(PIECE_GLYPHS['w'][m.captured]);
          }
        }
      });

      capturedByWhiteEl.textContent = whiteCaptures.join(' ');
      capturedByBlackEl.textContent = blackCaptures.join(' ');

      // Render Move Log
      moveHistoryEl.innerHTML = '';
      for (let i = 0; i < history.length; i += 2) {
        const row = document.createElement('div');
        row.className = 'move-row';
        const moveNum = Math.floor(i / 2) + 1;
        const wMove = history[i] ? `${history[i]. piece.toUpperCase() !== 'P' ? '' : ''}${history[i].san}` : '';
        const bMove = history[i + 1] ? history[i + 1].san : '';
        row.innerHTML = `
          <span class="move-num">${moveNum}.</span>
          <span>${wMove}</span>
          <span>${bMove}</span>
        `;
        moveHistoryEl.appendChild(row);
      }
      moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    // Button Controls
    document.getElementById('btn-flip').addEventListener('click', () => {
      isFlipped = !isFlipped;
      boardEl.classList.toggle('flipped', isFlipped);
    });

    document.getElementById('btn-undo').addEventListener('click', () => {
      game.undo();
      selectedSquare = null;
      legalMovesForSelected = [];
      const history = game.history({ verbose: true });
      const last = history[history.length - 1];
      lastMoveSquares = last ? [last.from, last.to] : [];
      renderBoard();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      game.reset();
      selectedSquare = null;
      legalMovesForSelected = [];
      lastMoveSquares = [];
      isFlipped = false;
      boardEl.classList.remove('flipped');
      renderBoard();
    });

    // Initialize Board
    renderBoard();
  </script>
</body>
</html>
